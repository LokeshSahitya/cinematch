# CineMatch — GitHub Actions CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Triggers: push to main → test → deploy to Vercel (frontend) + Railway (backend)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Test Backend ────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ML engine smoke test
        run: |
          python -c "
          from app.ml.engine import RecommendationEngine
          engine = RecommendationEngine()
          engine.load()
          assert engine.is_loaded
          recs = engine.recommend_content(1, top_n=5)
          assert len(recs) > 0, 'Content recs should not be empty'
          hybrid = engine.recommend_hybrid(1, top_n=5)
          assert len(hybrid) > 0, 'Hybrid recs should not be empty'
          print('✅ All ML tests passed')
          "

      - name: Test API imports
        run: |
          python -c "
          from app.main import app
          from app.api.movies import router as movies_router
          from app.api.recommendations import router as recs_router
          from app.api.search import router as search_router
          print('✅ All API imports successful')
          "

  # ── 2. Test Frontend ────────────────────────────────────────────────────────
  test-frontend:
    name: 🎨 Test Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api

      - name: Check build output
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✅ Build succeeded"

  # ── 3. Deploy Frontend to Vercel ──────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Deploy Frontend → Vercel
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: "--prod"

  # ── 4. Deploy Backend to Railway ──────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend → Railway
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service cinematch-backend
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
